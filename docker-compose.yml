services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672" # Port untuk aplikasi (protocol AMQP)
      - "15672:15672" # Port untuk management UI
    environment:
      - RABBITMQ_DEFAULT_USER=todo_user
      - RABBITMQ_DEFAULT_PASS=todo_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics","-q","check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=todo_user
      - POSTGRES_PASSWORD=todo_pass
      - POSTGRES_DB=todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  todo-svc:
    build: ./services/todo-svc
    ports: 
      - "8080:8080"
    environment:
      - PORT=8080
      - NOTIF_SVC_URL=http://notif-svc:8081
      - DB_DSN=postgres://todo_user:todo_pass@postgres:5432/todo_db?sslmode=disable
      - RABBITMQ_URL=amqp://todo_user:todo_pass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notif-svc:
    build: ./services/notif-svc
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - RABBITMQ_URL=amqp://todo_user:todo_pass@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
    