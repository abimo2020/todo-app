services:
  mongodb:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=notif_user
      - MONGO_INITDB_ROOT_PASSWORD=notif_pass
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval","db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5672:5672" # Port untuk aplikasi (protocol AMQP)
      - "15672:15672" # Port untuk management UI
    environment:
      - RABBITMQ_DEFAULT_USER=todo_user
      - RABBITMQ_DEFAULT_PASS=todo_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics","-q","check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=todo_user
      - POSTGRES_PASSWORD=todo_pass
      - POSTGRES_DB=todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  todo-svc:
    build: ./services/todo-svc
    ports: 
      - "8080:8080"
    environment:
      - PORT=8080
      - NOTIF_SVC_URL=http://notif-svc:8081
      - DB_DSN=postgres://todo_user:todo_pass@postgres:5432/todo_db?sslmode=disable
      - RABBITMQ_URL=amqp://todo_user:todo_pass@rabbitmq:5672/
      - LOG_FORMAT=json
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notif-svc:
    build: ./services/notif-svc
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - RABBITMQ_URL=amqp://todo_user:todo_pass@rabbitmq:5672/
      - MONGO_URI=mongodb://notif_user:notif_pass@mongodb:27017/?authSource=admin
      - LOG_FORMAT="json"
      - GIN_MODE=release
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  mongo_data: