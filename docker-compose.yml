services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=todo_user
      - POSTGRES_PASSWORD=todo_pass
      - POSTGRES_DB=todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo-user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  todo-svc:
    build: ./services/todo-svc
    ports: 
      - "8080:8080"
    environment:
      - PORT=8080
      - NOTIF_SVC_URL=http://notif-svc:8081
      - DB_DSN=postgres://todo_user:todo_pass@postgres:5432/todo_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      notif-svc:
        condition: service_started

  notif-svc:
    build: ./services/notif-svc
    ports:
      - "8081:8081"
    environment:
      - PORT=8081

volumes:
  postgres_data:
    